<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AetherDrive — прототип</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>AetherDrive — быстрый прототип</h1>
    <p>Простой веб-интерфейс для загрузки, просмотра и скачивания файлов (локально в браузере).</p>
  </header>

  <main>
    <section class="controls">
      <input id="fileInput" type="file" multiple />
      <button id="exportAll">Экспортировать все (backup)</button>
      <button id="importBackup">Импортировать backup</button>
      <input id="search" placeholder="Поиск файла..." />
    </section>

    <section id="filesArea">
      <table id="filesTable">
        <thead>
          <tr><th>Имя</th><th>Размер</th><th>Тип</th><th>Дата</th><th>Действия</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <p id="emptyMsg">Файлов пока нет — загрузите через «Выбрать файлы».</p>
    </section>
  </main>

  <footer>
    <small>Демо: файлы сохраняются в localStorage браузера. Для общего доступа/сервера нужен бэкенд.</small>
  </footer>

  <script src="app.js"></script>
</body>
</html>
